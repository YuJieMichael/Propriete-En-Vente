project_id = "propriete-en-vente"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/#auth/callback", "http://localhost:5173/#auth/callback", "http://127.0.0.1:4174/#auth/callback"]
minimum_password_length = 8
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 0

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[functions.invite-staff]
# getClaims + getUser inside the function verify the caller explicitly and
# support asymmetric JWT signing keys. Never remove those checks.
verify_jwt = false

[functions.staff-email-verification]
# Identity and signed JWT claims are validated inside every request.
verify_jwt = false

[functions.submit-enquiry]
# Public intake: validated body, origin check and database rate limits.
verify_jwt = false

[functions.send-enquiry-batches]
# Private scheduled worker: requires ENQUIRY_CRON_TOKEN, never a browser key.
verify_jwt = false

[functions.submit-listing]
# Public intake, bounded photo payloads and service-side validation/rate limits.
verify_jwt = false
