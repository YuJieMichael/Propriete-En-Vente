<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://proprieteenvente.ca/" />
    <meta
      name="description"
      content="Consultez les annonces immobilières à Montréal et au Québec. Propriétaires et courtiers peuvent soumettre une annonce pour examen."
    />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://usngcexxobcpjncuwaxo.supabase.co" crossorigin />
    <title>Annonces immobilières à Montréal et au Québec | Propriété En Vente</title>
    <style>
      #root > .static-page { box-sizing: border-box; width: 100%; max-width: 72rem; margin: 0 auto; padding: 1rem; color: #263c23; }
      #root > .static-page nav { line-height: 1.8; }
      #root > .static-page a { color: #365b2d; text-decoration: underline; text-underline-offset: .15em; }
      #root > .static-page h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); line-height: 1.2; }
      #root > .static-page li + li { margin-top: .65rem; }
      #root > footer.static-page { display: block; background: transparent; }

      /* Property HTML stays readable and styled while the app is downloading. */
      #root > .static-property-header {
        max-width: none; min-height: 82px; padding: 10px clamp(16px, 4vw, 68px);
        background: #fff; border-bottom: 1px solid #daded8;
      }
      .static-property-header nav, .static-property-languages {
        display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px;
      }
      .static-property-header nav { min-height: 61px; justify-content: space-between; }
      #root .static-property-header a.static-property-brand {
        display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
        font-size: 1.125rem; font-weight: 800;
      }
      .static-property-languages a[aria-current="page"] { font-weight: 750; }
      #root .static-property {
        width: 100%; max-width: 1256px; margin: 0 auto;
        padding: clamp(20px, 3vw, 42px) clamp(16px, 3vw, 28px) 48px;
        color: #263c23;
        overflow-wrap: anywhere;
      }
      .static-property, .static-property-header { font-family: var(--font-sans, system-ui, sans-serif); }
      #root .static-property a { color: #365b2d; text-decoration: underline; text-underline-offset: .15em; }
      .static-property-heading {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px 28px; margin: 20px 0;
      }
      #root .static-property h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 4vw, 2.5rem); line-height: 1.2; letter-spacing: -.025em; }
      .static-property h2 { font-size: clamp(1.2rem, 2vw, 1.65rem); }
      .static-property-heading p { margin: 0; color: #52624c; }
      .static-property-price {
        flex: none; background: #fff; border: 1px solid #daded8; border-radius: 12px;
        padding: 10px 16px; font-size: clamp(1.15rem, 2.3vw, 1.75rem);
      }
      .static-property-media {
        overflow: hidden; margin: 0 0 24px; border-radius: 14px;
        background: #ebe3dc; aspect-ratio: 2.65; position: relative;
      }
      .static-property-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .static-property-media figcaption {
        position: absolute; bottom: 10px; left: 10px; right: 10px; width: fit-content;
        padding: 4px 10px; border-radius: 7px; color: #fff; background: #263c23; font-size: .8rem;
      }
      .static-property-withheld {
        padding: 14px 18px; border: 1px solid #daded8; border-radius: 12px; background: #fff;
      }
      @media (max-width: 600px) {
        .static-property-heading { align-items: flex-start; flex-direction: column; }
        .static-property-media { aspect-ratio: 1.55; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
